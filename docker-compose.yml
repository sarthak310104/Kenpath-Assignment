services:
  db:
    image: postgres:16
    container_name: sweety-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sweety
    ports:
      # Host port 5433 avoids clashing with a local Postgres install on 5432.
      - "5433:5432"
    volumes:
      - sweety-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sweety"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  sweety-pgdata: